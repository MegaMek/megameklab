name: MegaMekLab CI with Gradle

on:
  pull_request:
    branches: [ main ]

env:
  GRADLE_OPTS: "-Dscan.link.VCS=${{ github.event.pull_request.html_url }}"

jobs:
  pr_ci:
    runs-on: ${{ matrix.os }}

    outputs:
      mmRepo: ${{ steps.find_mm.outputs.mmRepo }}
      mmBranch: ${{ steps.find_mm.outputs.mmBranch }}

    strategy:
      matrix:
        os: [ ubuntu-latest ]
        java-distribution: [ temurin ]
        java-version: [ 21, 25 ]
      fail-fast: false

    steps:
      - name: Find the Right Data Branch
        id: find_data
        shell: bash {0}
        env:
          FORK_OWNER: ${{ github.event.pull_request.head.repo.owner.login }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set +e
          git ls-remote --exit-code --heads \
            "https://github.com/${FORK_OWNER}/mm-data.git" \
            "refs/heads/${HEAD_REF}" > /dev/null
          status=$?
          set -e
          case "$status" in
            0)
              echo "dataRepo=${FORK_OWNER}/mm-data" >> "$GITHUB_OUTPUT"
              echo "dataBranch=${HEAD_REF}" >> "$GITHUB_OUTPUT"
              ;;
            2)
              echo "dataRepo=MegaMek/mm-data" >> "$GITHUB_OUTPUT"
              echo "dataBranch=main" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Failed to query matching mm-data branch (git exit $status)." >&2
              exit "$status"
              ;;
          esac

      - name: Checkout Data Repo
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.find_data.outputs.dataRepo }}
          ref: ${{ steps.find_data.outputs.dataBranch }}
          path: mm-data

      - name: Checking out MegaMekLab
        uses: actions/checkout@v7
        with:
          path: megameklab

      - name: Find the Right MegaMek Branch
        id: find_mm
        shell: bash {0}
        env:
          FORK_OWNER: ${{ github.event.pull_request.head.repo.owner.login }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set +e
          git ls-remote --exit-code --heads \
            "https://github.com/${FORK_OWNER}/megamek.git" \
            "refs/heads/${HEAD_REF}" > /dev/null
          status=$?
          set -e
          case "$status" in
            0)
              echo "mmRepo=${FORK_OWNER}/megamek" >> "$GITHUB_OUTPUT"
              echo "mmBranch=${HEAD_REF}" >> "$GITHUB_OUTPUT"
              ;;
            2)
              echo "mmRepo=MegaMek/megamek" >> "$GITHUB_OUTPUT"
              echo "mmBranch=main" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Failed to query matching MegaMek branch (git exit $status)." >&2
              exit "$status"
              ;;
          esac

      - name: Checkout MegaMek
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.find_mm.outputs.mmRepo }}
          ref: ${{ steps.find_mm.outputs.mmBranch }}
          path: megamek

      - name: Add MM Hash
        run: |
          cd megamek
          calculatedSha=$(git rev-parse HEAD)
          echo "$calculatedSha" >> ../megameklab/megameklab/docs/mm-revision.txt

      - name: Set short git commit SHA
        id: vars
        run: |
          cd megameklab
          calculatedSha=$(git rev-parse --short ${{ github.sha }})
          echo "COMMIT_SHORT_SHA=$calculatedSha" >> $GITHUB_ENV

      - name: "Output branch information to Version file"
        run: |
          echo "branch=PR-${{ github.event.number }}" >> megamek/megamek/resources/extraVersion.properties
          echo "gitHash=${{ env.COMMIT_SHORT_SHA }}" >> megamek/megamek/resources/extraVersion.properties

      - name: Set up ${{ matrix.java-distribution }} JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v6
        with:
          distribution: ${{ matrix.java-distribution }}
          java-version: ${{ matrix.java-version }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Add MMLRevision file
        run: |
          echo ${{ github.sha }} >> megameklab/megameklab/mml-revision.txt

      - name: Test All
        working-directory: megameklab
        run: ./gradlew testAll --stacktrace --scan -x checkstyleMain -x checkstyleTest

      - name: Upload Test Logs on Failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: cd-failure-logs
          path: ./megameklab/megameklab/build/reports/

      - name: CodeCov.io Coverage Report
        uses: codecov/codecov-action@v7
        with:
          directory: ./megameklab/megameklab/build/reports/jacoco/test
          fail_ci_if_error: false
          verbose: true

      - name: Build with Gradle
        working-directory: megameklab
        run: ./gradlew build -x test -PextraVersion="PR-${{ github.event.number }}-${{ env.COMMIT_SHORT_SHA }}"

      - name: Upload TarGZ Release
        uses: actions/upload-artifact@v7
        with:
          name: mml-release-tgz-${{ matrix.java-distribution }}-jdk${{ matrix.java-version }}
          path: ./megameklab/megameklab/build/distributions/*.tar.gz
