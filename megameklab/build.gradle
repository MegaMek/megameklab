import java.time.LocalDateTime
import java.util.zip.ZipInputStream

plugins {
    id 'application'
    id 'com.palantir.git-version' version '5.0.0'
    id 'edu.sc.seis.launch4j' version '4.0.0'
    id "io.sentry.jvm.gradle" version '6.4.0'
    id 'jacoco'
    id 'java'
    id 'checkstyle'
    id 'com.diffplug.spotless' version '8.10.1'
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = true
    reproducibleFileOrder = true
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
        resources {
            srcDirs = ['resources']
        }
    }
    test {
        java {
            srcDirs = ['unittests']
        }
        resources {
            srcDirs = ['testresources']
        }
    }
}

ext {
    mmlJvmOptions = ['-Xmx1024m', '-Dsun.awt.disablegrab=true']
    fileStagingDir = "${layout.buildDirectory.get()}/files"

    mmDir = "${rootDir}/../megamek"
}

dependencies {
    implementation "org.megamek:megamek:${version}"

    implementation 'com.fasterxml.jackson.core:jackson-core:2.22.1'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.1'

    implementation 'jakarta.xml.bind:jakarta.xml.bind-api:4.0.5'
    implementation 'jakarta.annotation:jakarta.annotation-api:3.0.0'

    implementation 'org.apache.logging.log4j:log4j-core:2.25.4'

    implementation 'org.apache.pdfbox:pdfbox:3.0.7'

    implementation('org.apache.xmlgraphics:batik-bridge:1.19') {
        // We don't need the python and javascript engine taking up space
        exclude group: 'org.python', module: 'jython'
        exclude group: 'org.mozilla', module: 'rhino'
        exclude group: 'xml-apis'
    }

    implementation('org.apache.xmlgraphics:batik-codec:1.19') {
        exclude group: 'xml-apis'
    }

    implementation('org.apache.xmlgraphics:batik-dom:1.19') {
        exclude group: 'xml-apis'
    }

    implementation 'org.apache.xmlgraphics:batik-rasterizer:1.19'
    implementation 'org.apache.xmlgraphics:batik-svggen:1.19'

    implementation('org.apache.xmlgraphics:fop:2.11') {
        // We don't need this proprietary module
        exclude group: 'com.sun.media', module: 'jai-codec'
        exclude group: 'xml-apis'
    }

    implementation 'com.formdev:flatlaf:3.7.1'
    implementation 'com.formdev:flatlaf-extras:3.7.1'

    implementation('org.apache.commons:commons-collections4:4.5.0')

    testImplementation 'org.mockito:mockito-core:5.23.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:6.0.3'

    runtimeOnly 'org.glassfish.jaxb:jaxb-runtime:4.0.7'

    //Required for printing scaled vector graphics (SVG) - EclipseIDE Compatibility.
    runtimeOnly 'xml-apis:xml-apis-ext:1.3.04'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.0.3'
}

application {
    mainClass = 'megameklab.MegaMekLab'
    applicationDefaultJvmArgs = [
            '-Xmx1024m',
    ]
}

checkstyle {
    toolVersion = '13.4.0'
    configFile = file("${rootDir}/config/checkstyle/checkstyle.xml")
    configProperties = [
            'suppressionFile': file("${rootDir}/config/checkstyle/checkstyle-suppressions.xml")
    ]
    maxWarnings = 0  // Fail on any warning
    maxErrors = 0    // Fail on any error
}

tasks.withType(Checkstyle).configureEach {
    minHeapSize = "1g"
    maxHeapSize = "4g"
}

// Source hygiene checks that do not depend on which editor wrote the code: import order, unused imports, trailing
// whitespace, final newline. `./gradlew spotlessCheck` reports every violation in one run; `./gradlew spotlessApply`
// fixes them all. The Checkstyle workflow runs the check as its first step on every PR. Same setup as MegaMek.
//
// Deliberately no full formatter engine yet. The Java style in .editorconfig uses a 6-space continuation indent and
// IntelliJ's wrapping rules, which the Eclipse engine Spotless bundles cannot reproduce; enabling it would reformat
// most of the tree and then fight IntelliJ on every wrapped line. Choosing an engine is a separate decision.
spotless {
    // Checked explicitly by CI rather than as part of `build`, so a plain build stays fast and works in a shallow
    // checkout that has no origin/main to ratchet against.
    enforceCheck = false

    // Until the whole tree has been formatted once, only look at files that differ from origin/main. Pass
    // -PspotlessFullTree to format everything (used for the one-time reformat and to measure it).
    if (!project.hasProperty('spotlessFullTree')) {
        ratchetFrom 'origin/main'
    }

    java {
        target 'src/**/*.java', 'unittests/**/*.java'

        // Matches ij_java_imports_layout in .editorconfig: static imports, then java/javax, then everything else.
        importOrder('\\#', 'java|javax', '')
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()

        // Same fence .editorconfig configures for IntelliJ.
        toggleOffOn('@formatter:off', '@formatter:on')
    }
}

jar {
    archiveFileName = "MegaMekLab.jar"
    manifest {
        attributes "Main-Class": application.mainClass
        if (rootProject.findProperty('suiteReleaseVersion') != null) {
            attributes "Implementation-Version": project.version.toString()
        }
        attributes "Class-Path": "lib/MegaMek.jar " + (project.sourceSets.main.runtimeClasspath.files
                .findAll { it.name.endsWith(".jar") && !it.name.toLowerCase().startsWith("megamek") }
                .collect { "lib/${it.name}" }.join(' '))
        attributes "Add-Opens": 'java.base/java.util java.base/java.util.concurrent'
        attributes "Build-Date": LocalDateTime.now()
        attributes "Sealed": true
    }
}

// Data is staged directly out of mm-data/data (no intermediate staging copy) and split
// into several Sync tasks by how often the content changes. The large, rarely-edited
// image and font trees each own a disjoint subtree of data/, so editing loose data
// (units, names) only re-copies the small text payload and leaves the image assets
// untouched (UP-TO-DATE). stageDataFiles aggregates them.
// Derived from rootDir (the megameklab build root) rather than a build-file-relative
// path, so it survives project-layout changes. mm-data is a sibling of this build root
// (settings.gradle includes it as ../mm-data).
def mmDataDir = "${rootDir}/../mm-data"
def mmlDataOut = "${projectDir}/data"

// Never stage macOS/Windows directory-metadata junk, regardless of what a developer's
// file browser may have dropped into the source tree.
tasks.withType(Sync).configureEach {
    exclude "**/.DS_Store"
    exclude "**/Thumbs.db"
}

tasks.register('stageDataImages', Sync) {
    description = "Syncs image data from mm-data"
    group = 'build'
    from("${mmDataDir}/data/images") {
        include "fluff/**/*.*"
        include "misc/**/*.*"
        include "recordsheets/**/*.*"
        include "units/**/*.*"
        include "universe/**/*.*"
        include "widgets/**/*.*"
    }
    into "${mmlDataOut}/images"
}

tasks.register('stageDataFonts', Sync) {
    description = "Syncs font data from mm-data"
    group = 'build'
    from "${mmDataDir}/data/fonts"
    into "${mmlDataOut}/fonts"
}

tasks.register('stageDataMekfiles', Sync) {
    dependsOn gradle.includedBuild('mm-data').task(':unitFilesZip')
    description = "Syncs unit files (loose text plus the zipped unit archive) from mm-data"
    group = 'build'
    from("${mmDataDir}/data/mekfiles") {
        include "*.txt"
        include "*.xml"
    }
    from "${mmDataDir}/build/staging/mekfiles"
    into "${mmlDataOut}/mekfiles"
}

tasks.register('stageDataRat', Sync) {
    dependsOn gradle.includedBuild('mm-data').task(':ratZip')
    description = "Syncs the random assignment table archive from mm-data"
    group = 'build'
    from "${mmDataDir}/build/staging/rat"
    into "${mmlDataOut}/rat"
}

tasks.register('stageData', Sync) {
    description = "Syncs all remaining loose data from mm-data"
    group = 'build'
    from("${mmDataDir}/data") {
        include "forcegenerator/**/*.*"
        include "names/**/*.*"
        include "sourcebooks/*.*"
        include "universe/eras.xml"
        include "universe/ranks.xml"
        include "universe/commands/**/*.*"
        include "universe/factions/**/*.*"
    }
    into mmlDataOut
    // The big asset trees are owned by the dedicated tasks above; don't delete them.
    preserve {
        include "images/**"
        include "fonts/**"
        include "mekfiles/**"
        include "rat/**"
    }
}

tasks.register('stageDataFiles') {
    description = "Aggregates the split Sync tasks that stage MegaMekLab's data/ directory from mm-data."
    group = 'build'
    dependsOn stageDataImages
    dependsOn stageDataFonts
    dependsOn stageDataMekfiles
    dependsOn stageDataRat
    dependsOn stageData
}

tasks.register('generateDynamicFiles') {
    def jvmOptions = project.ext.mmlJvmOptions.join('\n')

    doLast {
        new File("${projectDir}/docs/mml-revision.txt").text = versionDetails().gitHashFull
        new File("${projectDir}/MegaMekLab.l4j.ini").text = """# Launch4j runtime config
# you can add arguments here that will be processed by the JVM at runtime
${jvmOptions}
"""
    }
}

tasks.register("stageLicenseFiles", Sync) {
    description = "Copy the license files to the build folder."
    group = 'build'
    from "../"
    into "${layout.buildDirectory.get()}/licenses"

    includes = [
            'LICENSE',
            'LICENSE.code',
            'LICENSE.assets',
            'README.md'
    ]

}

tasks.register("copyLicenseFiles", Copy) {
    description = "Copies from the build folder to the staging folder"
    group = 'build'

    dependsOn stageLicenseFiles

    from "${layout.buildDirectory.get()}/licenses"
    into fileStagingDir
}

tasks.register('stageFiles', Copy) {
    description = 'Stages files that are to be copied into the distribution.'

    mustRunAfter(stageDataFiles)
    dependsOn gradle.includedBuild('megamek').task(':megamek:compileJava')
    dependsOn generateDynamicFiles
    dependsOn copyLicenseFiles

    from projectDir
    include "mmconf/**"
    include "data/**"
    include "docs/**"
    include 'SubmitBug.html'
    include "sentry.properties"
    include "*.ini"
    exclude "**/*.psd"

    // User Config Files
    exclude "mmconf/clientsettings.xml"
    exclude "mmconf/gameoptions.xml"
    exclude "mmconf/megameklab.properties"
    exclude "mmconf/megameklab.properties.bak"
    exclude "mmconf/mhq.preferences"
    exclude "mmconf/mm.preferences"
    exclude "mmconf/mml.preferences"
    exclude "mmconf/recent-advanced-searches.json"
    exclude "mmconf/searches/*.json"

    exclude("data/**/*.cache")

    into fileStagingDir

    doLast {
        mkdir "${fileStagingDir}/logs"
    }
}

tasks.register('createStartScripts', CreateStartScripts) {
    description = 'Create shell script for generic distribution.'
    applicationName = 'MegaMekLab'
    mainClass = application.mainClass
    outputDir = startScripts.outputDir
    classpath = jar.outputs.files + files(project.sourceSets.main.runtimeClasspath.files)
            .filter { it.name.endsWith(".jar") }
}

tasks.register('createSvgMassPrinterScripts', CreateStartScripts) {
    description = 'Create launcher scripts (svgmassprinter / svgmassprinter.bat) for the SVG mass printer CLI tool.'
    applicationName = 'svgmassprinter'
    mainClass = 'megameklab.printing.SVGMassPrinter'
    outputDir = layout.buildDirectory.dir('svgMassPrinterScripts').get().asFile
    classpath = jar.outputs.files + files(project.sourceSets.main.runtimeClasspath.files)
            .filter { it.name.endsWith(".jar") }
    // The mass export loads every unit; give it plenty of heap by default.
    defaultJvmOpts = ['-Xmx4g']
}

distributions {
    main {
        distributionBaseName = 'MegaMekLab'
        contents {
            from("${mmDir}/megamek/mmconf/log4j2.xml") {
                exclude 'log4j2.xml'
            }

            from(fileStagingDir) {
                exclude 'history.txt'
            }

            if (rootProject.findProperty('suiteReleaseVersion') != null) {
                from(layout.buildDirectory.file('suite/suite-build.properties'))
            }

            from("${mmDir}/megamek/build/libs/MegaMek.jar") {
                into "lib"
            }

            from("${projectDir}/scripts") {
                rename "shell.sh", "MegaMekLab.sh"
            }

            from(jar)

            from(project.sourceSets.main.runtimeClasspath.files
                    .findAll { it.name.endsWith(".jar") && !it.name.toLowerCase().startsWith("megamek") }) {
                into "lib"
            }

            from("${buildDir}/launch4j") {
                include '*.exe'
            }

            from(jar) {
                into "lib"
            }

            duplicatesStrategy = 'exclude'
        }
    }
}

// ---------------------------------------------------------------------------
// Standalone SVGMassPrinter CLI distribution.
//
// These are defined as explicit install/zip/tar tasks (rather than via the `distributions {}` DSL) so they are
// NOT wired into the `assemble` / `build` / `assembleDist` lifecycle. That keeps the SVGMassPrinter tool out of
// regular MegaMekLab releases; build it on demand with one of:
//   ./gradlew svgMassPrinterInstall   (unpacked, run bin/svgmassprinter from the install dir)
//   ./gradlew svgMassPrinterZip
//   ./gradlew svgMassPrinterTar
// ---------------------------------------------------------------------------
ext.svgMassPrinterDistName = 'MegaMekLab-SVGMassPrinter'
ext.svgMassPrinterInstallDir = layout.buildDirectory.dir("install/${svgMassPrinterDistName}")

tasks.register('svgMassPrinterInstall', Sync) {
    description = 'Installs the standalone SVGMassPrinter CLI tool (not part of regular releases).'
    group = 'distribution'
    dependsOn stageDataFiles
    dependsOn stageFiles
    dependsOn jar
    dependsOn createSvgMassPrinterScripts

    into svgMassPrinterInstallDir

    from("${mmDir}/megamek/mmconf/log4j2.xml") {
        exclude 'log4j2.xml'
    }
    from(fileStagingDir) {
        exclude 'history.txt'
    }
    from("${mmDir}/megamek/build/libs/MegaMek.jar") {
        into "lib"
    }
    from(project.sourceSets.main.runtimeClasspath.files
            .findAll { it.name.endsWith(".jar") && !it.name.toLowerCase().startsWith("megamek") }) {
        into "lib"
    }
    from(jar) {
        into "lib"
    }
    from(tasks.named('createSvgMassPrinterScripts')) {
        into "bin"
    }
    duplicatesStrategy = 'exclude'
}

tasks.register('svgMassPrinterZip', Zip) {
    description = 'Packages the standalone SVGMassPrinter CLI tool as a zip (not part of regular releases).'
    group = 'distribution'
    dependsOn svgMassPrinterInstall
    archiveBaseName = svgMassPrinterDistName
    from(svgMassPrinterInstallDir) {
        into svgMassPrinterDistName
    }
}

tasks.register('svgMassPrinterTar', Tar) {
    description = 'Packages the standalone SVGMassPrinter CLI tool as a tar.gz (not part of regular releases).'
    group = 'distribution'
    dependsOn svgMassPrinterInstall
    archiveBaseName = svgMassPrinterDistName
    archiveExtension = 'tar.gz'
    compression = Compression.GZIP
    from(svgMassPrinterInstallDir) {
        into svgMassPrinterDistName
    }
}

launch4j {
    description = 'Create Windows executable for MegaMekLab'
    mainClassName = application.mainClass
    outfile = "MegaMekLab.exe"
    icon = "${projectDir}/data/images/misc/megameklab.ico"
    jarTask = project.tasks.jar
    internalName = 'MegaMekLab'
    downloadUrl = 'https://github.com/MegaMek/megamek/wiki/Updating-to-Adoptium-(Eclipse-Temurin-Open-Source-Java)'
    supportUrl = 'https://megamek.org'
    copyright = '2026 MegaMek Development Team.'
    trademarks = 'MechWarrior, BattleMech, `Mech and AeroTech - The The Topps Company, Inc. Catalyst Game Labs - InMediaRes Productions, LLC.'
    companyName = "MegaMek Development Team"
    jvmOptions = project.ext.mmlJvmOptions
    jreMinVersion = '21'
    dontWrapJar = true
    messagesJreVersionError = 'We require a Java Runtime of version 21 or higher installed. https://github.' +
            'com/MegaMek/megamek/wiki/Updating-to-Adoptium-(Eclipse-Temurin-Open-Source-Java)'
    messagesJreNotFoundError = 'Go here for instructions on installing the correct version of Java: https://github.com/MegaMek/megamek/wiki/Updating-to-Adoptium-(Eclipse-Temurin-Open-Source-Java)'
}

project.tasks.createExe.dependsOn(stageDataFiles)
project.tasks.createExe.mustRunAfter(stageDataFiles)

tasks.register("packagePrepWork") {
    description = 'General Catch All for all distributions'
    dependsOn stageFiles
    dependsOn startScripts
    dependsOn createStartScripts
    dependsOn createAllExecutables
}

def suiteVersion = rootProject.findProperty('suiteReleaseVersion')?.toString()
if (suiteVersion != null) {
    // stageFiles reads a physical sibling JAR, not a Gradle project output. Force
    // its producer to run so an old build/libs/MegaMek.jar cannot be archived.
    tasks.named('stageFiles') {
        dependsOn gradle.includedBuild('megamek').task(':megamek:jar')
    }
    def suiteIdentity = [
            schemaVersion      : '1',
            product            : 'MegaMekLab',
            version            : suiteVersion,
            megamekCommit     : rootProject.property('suiteMegaMekCommit').toString(),
            megameklabCommit  : rootProject.property('suiteMegaMekLabCommit').toString(),
            mekhqCommit       : rootProject.property('suiteMekHQCommit').toString(),
            mmDataCommit      : rootProject.property('suiteMmDataCommit').toString(),
            minimumJavaVersion: '21'
    ]
    def writeSuiteIdentity = tasks.register('writeSuiteIdentity') {
        description = 'Writes the suite identity into the normal distribution root.'
        def identityFile = layout.buildDirectory.file('suite/suite-build.properties')
        outputs.file(identityFile)
        inputs.properties(suiteIdentity)
        doLast {
            def target = identityFile.get().asFile
            target.parentFile.mkdirs()
            target.setText(suiteIdentity.collect { key, value -> "${key}=${value}\n" }.join(''), 'UTF-8')
        }
    }
    tasks.named('distTar') {
        dependsOn writeSuiteIdentity
        // A stale Copy staging folder must never reintroduce user configuration.
        exclude '**/mmconf/clientsettings.xml', '**/mmconf/gameoptions.xml',
                '**/mmconf/megameklab.properties', '**/mmconf/megameklab.properties.bak',
                '**/mmconf/mhq.preferences', '**/mmconf/mm.preferences',
                '**/mmconf/mml.preferences', '**/mmconf/recent-advanced-searches.json',
                '**/mmconf/searches/*.json', '**/data/**/*.cache'
    }
    tasks.register('verifySuiteArchive') {
        description = 'Checks the built tar.gz for exact suite identity, runtime version, data and launcher layout.'
        group = 'verification'
        dependsOn tasks.named('distTar')
        doLast {
            def archive = tasks.named('distTar').get().archiveFile.get().asFile
            // Archive paths must be Strings: GString keys in a Set have different hash codes.
            String prefix = "MegaMekLab-${project.version}/"
            def required = [
                    'suite-build.properties', 'MegaMekLab.jar', 'lib/MegaMekLab.jar',
                    'lib/MegaMek.jar', 'MegaMekLab.sh', 'bin/MegaMekLab',
                    'bin/MegaMekLab.bat', 'data/mekfiles/unit_files.zip',
                    'data/rat/rat_default.zip', 'data/images/misc/megameklab.ico'
            ].collect { (prefix + it).toString() } as Set
            def privateConfig = [
                    'mmconf/clientsettings.xml', 'mmconf/gameoptions.xml',
                    'mmconf/megameklab.properties', 'mmconf/megameklab.properties.bak',
                    'mmconf/mhq.preferences', 'mmconf/mm.preferences', 'mmconf/mml.preferences',
                    'mmconf/recent-advanced-searches.json'
            ].collect { (prefix + it).toString() } as Set
            def found = [] as Set
            def payloadSources = [
                    'MegaMekLab.jar'                  : tasks.named('jar').get().archiveFile.get().asFile,
                    'lib/MegaMek.jar'                 : rootProject.file('../megamek/megamek/build/libs/MegaMek.jar'),
                    'data/mekfiles/unit_files.zip'   : rootProject.file('../mm-data/build/staging/mekfiles/unit_files.zip'),
                    'data/rat/rat_default.zip'       : rootProject.file('../mm-data/build/staging/rat/rat_default.zip'),
                    'data/images/misc/megameklab.ico': rootProject.file('../mm-data/data/images/misc/megameklab.ico')
            ]
            def digests = [:]
            def metadata = null
            def labManifestVersion = null
            def gameVersion = null
            tarTree(resources.gzip(archive)).visit { entry ->
                if (!entry.directory) {
                    String entryName = entry.relativePath.pathString
                    if (!entryName.startsWith(prefix) || !found.add(entryName)) {
                        throw new GradleException("Unexpected root or duplicate archive entry: ${entryName}")
                    }
                    if (payloadSources.containsKey(entryName.substring(prefix.length()))) {
                        // Read the entry once: for JARs we also inspect the embedded version below.
                        def bytes = entry.file.bytes
                        def relative = entryName.substring(prefix.length())
                        def hash = { content -> java.security.MessageDigest.getInstance('SHA-256')
                                .digest(content).encodeHex().toString() }
                        digests[relative] = hash(bytes)
                        if (relative == 'MegaMekLab.jar' || relative == 'lib/MegaMek.jar') {
                            def isLab = relative == 'MegaMekLab.jar'
                            new ZipInputStream(new ByteArrayInputStream(bytes)).withCloseable { zip ->
                                def zipEntry
                                while ((zipEntry = zip.nextEntry) != null) {
                                    if (isLab && zipEntry.name.equalsIgnoreCase('META-INF/MANIFEST.MF')) {
                                        labManifestVersion = new java.util.jar.Manifest(zip).mainAttributes.getValue('Implementation-Version')
                                    }
                                    if (!isLab && zipEntry.name == 'Version.properties') {
                                        def properties = new Properties()
                                        properties.load(zip)
                                        gameVersion = String.format('%d.%02d.%02d',
                                                Integer.parseInt(properties.getProperty('major')),
                                                Integer.parseInt(properties.getProperty('minor')),
                                                Integer.parseInt(properties.getProperty('patch')))
                                        if (properties.getProperty('revision')?.trim()) {
                                            throw new GradleException('MegaMek.jar contains a point-release revision')
                                        }
                                    }
                                    zip.closeEntry()
                                }
                            }
                        }
                    }
                    if (entryName == prefix + 'suite-build.properties') {
                        metadata = new Properties()
                        metadata.load(new ByteArrayInputStream(entry.file.bytes))
                    }
                }
            }
            if (!found.containsAll(required)) {
                throw new GradleException("Suite archive missing entries: ${required - found}")
            }
            if (found.any { it in privateConfig || it.startsWith(prefix + 'mmconf/searches/') ||
                    (it.startsWith(prefix + 'data/') && it.endsWith('.cache')) }) {
                throw new GradleException('Suite archive contains user configuration or cache files')
            }
            payloadSources.each { relative, source ->
                if (!source.isFile() || digests[relative] != java.security.MessageDigest
                        .getInstance('SHA-256').digest(source.bytes).encodeHex().toString()) {
                    throw new GradleException("Suite archive payload differs from pinned source: ${relative}")
                }
            }
            if (metadata == null || metadata.stringPropertyNames() != suiteIdentity.keySet() ||
                    suiteIdentity.any { key, value -> metadata.getProperty(key) != value } ||
                    labManifestVersion != suiteVersion || gameVersion != suiteVersion) {
                throw new GradleException("Suite archive identity or packaged runtime versions do not match ${suiteVersion}")
            }
        }
    }
}

distZip {
    description = 'Creates zip Package'
    enabled = false
    dependsOn packagePrepWork
}

distTar {
    description = 'Creates a TGZ package'
    dependsOn packagePrepWork
    archiveExtension = 'tar.gz'
    compression = Compression.GZIP
}

assemble {
    dependsOn jar
}

assembleDist {
    dependsOn distTar
}

test {
    useJUnitPlatform()
    dependsOn(checkstyleMain)

    minHeapSize = "1024m"
    maxHeapSize = "8192m"

    // report is always generated after tests run
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    // tests are required to run before generating the report
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

run {
    dependsOn(stageDataFiles)
    jvmArgs = mmlJvmOptions
}

tasks.register('processSystemTest', JavaExec) {
    dependsOn stageDataFiles
    dependsOn stageFiles
    description = 'Internal System Test. Dev use only.'
    group = 'other'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'megameklab.printing.CGLMassPrinter'
}

tasks.register('svgexport', JavaExec) {
    dependsOn stageDataFiles
    dependsOn stageFiles
    description = 'Internal System Test. Dev use only.'
    group = 'other'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'megameklab.printing.SVGMassPrinter'
}

tasks.register('cleanAll') {
    description = 'Cleans all related projects to ensure a proper build.'
    group = 'build'
    dependsOn gradle.includedBuild('mm-data').task(':clean')
    dependsOn gradle.includedBuild('megamek').task(':megamek:clean')
    dependsOn clean
}

tasks.register('testAll') {
    description = 'Cleans all related projects then runs all tests'
    group = 'verification'
    dependsOn cleanAll

    dependsOn gradle.includedBuild('megamek').task(':megamek:test')
    dependsOn test
}
